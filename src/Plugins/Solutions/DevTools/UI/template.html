<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gRPC UI AuthKit</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #161c24;
    --panel2: #1c2530;
    --border: #2a3646;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4f9cf9;
    --green: #3fb950;
    --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  .target { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px;
           background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .badge.stream { color: var(--accent); border-color: var(--accent); }
  .badge.live { color: var(--green); border-color: var(--green); }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); overflow: auto; background: var(--panel); }
  section { overflow: auto; padding: 16px; }
  .service { border-bottom: 1px solid var(--border); }
  .service > summary { cursor: pointer; padding: 10px 14px; font-weight: 600;
                       display: flex; gap: 8px; align-items: center; }
  .service > summary:hover { background: var(--panel2); }
  .methods { list-style: none; margin: 0; padding: 0 0 6px; }
  .methods li { padding: 6px 14px 6px 28px; cursor: pointer; display: flex;
                gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 13px; }
  .methods li:hover { background: var(--panel2); }
  .methods li.active { background: var(--accent); color: #fff; }
  .methods li.active .muted { color: #cfe4ff; }
  .muted { color: var(--muted); }
  .pill { font-size: 10px; padding: 1px 6px; border-radius: 8px;
          border: 1px solid var(--border); color: var(--muted); }
  .pill.uni { color: var(--green); border-color: var(--green); }
  .pill.srv { color: var(--accent); border-color: var(--accent); }
  .pill.cli { color: #d29922; border-color: #d29922; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .card h2 { margin: 0; font-size: 13px; padding: 10px 14px; border-bottom: 1px solid var(--border);
             background: var(--panel2); text-transform: uppercase; letter-spacing: .04em; }
  .card .body { padding: 12px 14px; }
  textarea { width: 100%; min-height: 120px; background: #0b1016; color: var(--text);
             border: 1px solid var(--border); border-radius: 6px; padding: 10px;
             font-family: var(--mono); font-size: 13px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
           padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-family: var(--mono); font-weight: 600; font-size: 13px; padding: 4px 12px;
            border-radius: 12px; border: 1px solid transparent; }
  .status.ok { color: var(--green); border-color: var(--green); }
  .status.err { color: var(--red); border-color: var(--red); }
  pre { background: #0b1016; border: 1px solid var(--border); border-radius: 6px;
        padding: 12px; overflow: auto; font-family: var(--mono); font-size: 13px;
        margin: 10px 0 0; max-height: 420px; white-space: pre-wrap; word-break: break-word; }
  .schema { font-family: var(--mono); font-size: 12.5px; }
  .schema .row-line { padding: 3px 0; }
  .schema .indent { padding-left: 22px; }
  .schema .type { color: var(--accent); }
  .schema .enum { color: #d29922; }
  .schema .rep { color: var(--muted); font-size: 11px; }
  .schema span.req { color: var(--green); }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>gRPC UI</h1>
  <span class="badge live">AuthKit plugin</span>
  <span class="target" id="target">scanning…</span>
</header>
<main>
  <aside id="services">
    <div class="empty" style="padding:14px;">Loading services…</div>
  </aside>
  <section id="detail">
    <div class="empty">Select method to inspect its schema and execute a request.</div>
  </section>
</main>
<script>
window.__GRPC_UI_BASE__ = "{{pathBase}}";
</script>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
